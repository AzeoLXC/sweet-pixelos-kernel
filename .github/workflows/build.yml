name: Build KernelSU Next PixelOS sweet

on:
  workflow_dispatch:
    inputs:
      ksu_branch:
        description: "KernelSU-Next branch to checkout"
        required: false
        default: "legacy-susfs"
        type: string
      ksu_repo:
        description: "KernelSU-Next repository"
        required: false
        default: "https://github.com/xtrance-eng/KernelSU-Next.git"
        type: string

permissions:
  contents: write

jobs:
  check:
    name: 1. Upstream & Metadata Check
    runs-on: ubuntu-22.04
    outputs:
      kernel_head: ${{ steps.get_meta.outputs.kernel_head }}
      build_time: ${{ steps.get_meta.outputs.build_time }}
      release_tag: ${{ steps.get_meta.outputs.release_tag }}
    steps:
      - name: Fetch Upstream Metadata
        id: get_meta
        run: |
          SHA=$(curl -s "https://api.github.com/repos/PixelOS-Devices/android_kernel_xiaomi_sm6150/commits/seventeen" | jq -r '.sha[0:7]')
          DATE=$(TZ=Asia/Jakarta date '+%Y%m%d_%H%M')
          TAG=$(TZ=Asia/Jakarta date '+%Y.%m.%d')
          echo "kernel_head=${SHA}" >> $GITHUB_OUTPUT
          echo "build_time=${DATE}" >> $GITHUB_OUTPUT
          echo "release_tag=${TAG}" >> $GITHUB_OUTPUT

  build:
    name: 2. Compile & Package Kernel
    needs: check
    runs-on: ubuntu-22.04
    outputs:
      zip_name: ${{ steps.package.outputs.zip_name }}
      sha256: ${{ steps.package.outputs.sha256 }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            aria2 bc bison build-essential ca-certificates cpio curl flex git \
            libc6-dev libelf-dev libssl-dev make openssl python3 \
            python-is-python3 zlib1g-dev ccache zip jq

      - name: Setup Toolchains
        run: |
          mkdir -p clang
          aria2c -q -s 16 -x 16 "https://github.com/ZyCromerZ/Clang/releases/download/17.0.0-20230725-release/Clang-17.0.0-20230725.tar.gz" -o clang.tar.gz
          tar -xzf clang.tar.gz -C clang/
          rm -f clang.tar.gz

          git clone --depth=1 https://github.com/greenforce-project/gcc-arm64 -b main gcc64
          git clone --depth=1 https://github.com/greenforce-project/gcc-arm -b main gcc32

          echo "CLANG_PATH=$GITHUB_WORKSPACE/clang" >> $GITHUB_ENV
          echo "GCC64_PATH=$GITHUB_WORKSPACE/gcc64" >> $GITHUB_ENV
          echo "GCC32_PATH=$GITHUB_WORKSPACE/gcc32" >> $GITHUB_ENV

      - name: Clone Kernel Source
        run: |
          git clone --depth=1 -b seventeen https://github.com/PixelOS-Devices/android_kernel_xiaomi_sm6150.git kernel

      - name: Setup KernelSU-Next, SuSFS & NoMount
        run: |
          cd kernel
          KSU_TARGET="${{ github.event.inputs.ksu_branch || 'legacy-susfs' }}"
          KSU_REPO="${{ github.event.inputs.ksu_repo || 'https://github.com/xtrance-eng/KernelSU-Next.git' }}"
          python3 ../scripts/patch_susfs_nomount.py \
            --ksu-repo "$KSU_REPO" \
            --ksu-branch "$KSU_TARGET"

      - name: Compile Kernel Image
        run: |
          cd kernel
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$CLANG_PATH/bin:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH"
          export KBUILD_BUILD_USER="azeolxc"
          export KBUILD_BUILD_HOST="PixelOS-sweet"

          make O=out ARCH=arm64 sweet_defconfig

          scripts/config --file out/.config \
            -e CONFIG_KSU \
            -e CONFIG_KPROBES \
            -e CONFIG_KRETPROBES \
            -e CONFIG_KSU_KPROBES_HOOK \
            -e CONFIG_KSU_SUSFS \
            -e CONFIG_KSU_SUSFS_SUS_PATH \
            -e CONFIG_KSU_SUSFS_SUS_MOUNT \
            -e CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT \
            -e CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT \
            -e CONFIG_KSU_SUSFS_SUS_KSTAT \
            -e CONFIG_KSU_SUSFS_TRY_UMOUNT \
            -e CONFIG_KSU_SUSFS_SPOOF_UNAME \
            -e CONFIG_KSU_SUSFS_ENABLE_LOG \
            -e CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
            -e CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
            -e CONFIG_KSU_SUSFS_OPEN_REDIRECT \
            -e CONFIG_KSU_SUSFS_SUS_MAP \
            -e CONFIG_NOMOUNT

          make O=out ARCH=arm64 olddefconfig

          make -j$(nproc --all) O=out ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=$GCC64_PATH/bin/aarch64-elf- \
            CROSS_COMPILE_ARM32=$GCC32_PATH/bin/arm-eabi- \
            Image.gz dtbs

      - name: Package with AnyKernel3
        id: package
        run: |
          ZIP_NAME="PixelOS-sweet-KernelSU-Next-SuSFS-NoMount-${{ needs.check.outputs.build_time }}.zip"

          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel
          cp anykernel_template/anykernel.sh anykernel/anykernel.sh
          cp kernel/out/arch/arm64/boot/Image.gz anykernel/Image.gz

          cd anykernel
          zip -r "../$ZIP_NAME" * -x .git README.md *placeholder
          cd ..

          SHA_VAL=$(sha256sum "$ZIP_NAME" | awk '{print $1}')
          echo "$SHA_VAL  $ZIP_NAME" > "${ZIP_NAME}.sha256"

          echo "zip_name=${ZIP_NAME}" >> $GITHUB_OUTPUT
          echo "sha256=${SHA_VAL}" >> $GITHUB_OUTPUT

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.zip_name }}
          path: |
            ${{ steps.package.outputs.zip_name }}
            ${{ steps.package.outputs.zip_name }}.sha256

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.check.outputs.release_tag }}
          ZIP_NAME: ${{ steps.package.outputs.zip_name }}
          KERNEL_HEAD: ${{ needs.check.outputs.kernel_head }}
        run: |
          NOTES=$(printf "KernelSU-Next + SuSFS + NoMount automated build for Redmi Note 10 Pro (sweet)\n- Base: PixelOS seventeen (Android 17)\n- Upstream: PixelOS-Devices/android_kernel_xiaomi_sm6150@%s\n- Kernel Version: 4.14.357-openela-VantomKernel\n- Root: KernelSU-Next (legacy-susfs)\n- Root Hiding: SuSFS v1.5.5 (kernel-4.14)\n- VFS Injection: NoMount (CONFIG_NOMOUNT=y)\n- Compiler: ZyCromerZ Clang 17.0.0" "$KERNEL_HEAD")

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP_NAME" "${ZIP_NAME}.sha256" --clobber
          else
            gh release create "$TAG" "$ZIP_NAME" "${ZIP_NAME}.sha256" \
              --title "$TAG" \
              --notes "$NOTES"
          fi

  notify:
    name: 3. Telegram Push Notification
    needs: [check, build]
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - name: Send Notification to Telegram
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BUILD_STATUS: ${{ needs.build.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.check.outputs.release_tag }}
          RELEASE_TAG: ${{ needs.check.outputs.release_tag }}
          KERNEL_HEAD: ${{ needs.check.outputs.kernel_head }}
          ZIP_NAME: ${{ needs.build.outputs.zip_name }}
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "Telegram credentials not configured. Skipping."
            exit 0
          fi

          if [ "$BUILD_STATUS" = "success" ]; then
            MSG="<b>Kernel Build Succeeded</b>%0A<b>Device:</b> Redmi Note 10 Pro (sweet)%0A<b>Base:</b> PixelOS seventeen (Android 17)%0A<b>Commit:</b> <code>${KERNEL_HEAD}</code>%0A<b>Features:</b> KernelSU-Next + SuSFS + NoMount%0A<b>Package:</b> <code>${ZIP_NAME}</code>%0A<b>SHA-256:</b> <code>${SHA256}</code>%0A<b>Release:</b> <a href=\"${RELEASE_URL}\">${RELEASE_TAG}</a>%0A<a href=\"${RUN_URL}\">View GitHub Run</a>"
          else
            MSG="<b>Kernel Build Failed</b>%0A<b>Device:</b> Redmi Note 10 Pro (sweet)%0A<b>Base:</b> PixelOS seventeen%0A<b>Status:</b> ${BUILD_STATUS}%0A<a href=\"${RUN_URL}\">View Error Log</a>"
          fi

          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true" \
            -d "text=${MSG}"
